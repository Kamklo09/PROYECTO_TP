<style>
    main {
        width: 100%;
        height: calc(100% - 3rem); /* Ocupa el alto restante */
        overflow-x: auto; /* Evita el desbordamiento horizontal en pantallas pequeñas */
        background: #ffffff;
        border-radius: 8px;
    }

    /* Tabla adaptable */
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    thead th {
        background-color: #f8fafc;
        color: #64748b;
        font-weight: 600;
        padding: 0.75rem 1rem;
        border-bottom: 2px solid #e2e8f0;
    }

    tbody tr {
        border-bottom: 1px solid #e2e8f0;
    }

    tbody tr:hover {
        background-color: #f1f5f9;
    }

    tbody td {
        padding: 0.75rem 1rem;
        vertical-align: middle;
    }

    tbody tr td button {
        font-size: 20px;
        margin-right: 20px;
        cursor: pointer;
    }

    /* Imágenes de usuario */
    table tbody tr img {
        border-radius: 50%;
        width: 35px;
        height: 35px;
        object-fit: cover;
        display: block;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
        color: #64748b;
    }

    .form-group {
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        font-size: 0.875rem;
        color: #64748b;
        margin-bottom: 0.25rem;
    }

    .form-group input {
        padding: 0.5rem;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        font-size: 1rem;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 1.5rem;
    }

    .btn-cancel {
        background: #e2e8f0;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-save {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
    }
</style>
