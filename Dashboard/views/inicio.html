<style>
    .controlpanel-container {
        display: grid;
        grid-template-columns: 150px repeat(3 1fr);
        grid-template-rows: repeat(3, 1fr);
        grid-template-areas: 
        "cp-header cp-header cp-header"
        "cp-body cp-body cp-body"
        "cp-body cp-body cp-body"
        "cp-body cp-body cp-body" ;
        padding: 0px 20px;
    }

    .cp-header {
        display: grid;
        grid-template-columns: repeat(4, auto);
        grid-template-rows: repeat(2, auto);
        grid-template-areas: 
        "date   attendance   entries    entries"
        "date   attendance  exits      exits";
        column-gap: 20px;
        row-gap: 10px;
    }

    .cp-fast-info {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 1.5rem;
        background: linear-gradient(to right, #2F3542, #434b5d);
        padding: 15px 20px;
        border-radius: 16px;
        color: white;
    }

    .cp-body {
        display: grid;
        grid-template-columns: ;
        grid-template-rows: ;
        grid-template-areas: 
        "last-entries . . ."
        "last-entries . . .";
        column-gap: 20px;
        row-gap: 10px;
    }

</style>




<main class="controlpanel-container"> 
    <section class="cp-header" style="grid-area: cp-header;">

        <article id="date" class="cp-fast-info" style="grid-area: date;">
            Cargando fecha...
        </article>

        <article id="attendance" class="cp-fast-info" style="grid-area: attendance;">
            cargando asistencia...
        </article>

        <article id="entries" class="cp-fast-info" style="grid-area: entries;">
            cargando entradas...
        </article>

        <article id="exits" class="cp-fast-info" style="grid-area: exits;">
            cargando salidas...
        </article>

        
    </section>

    <section class="cp-body" style="grid-area: cp-body;">
        <article id="last-entries" class="cp-body-fast-info">
            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="/Dashboard/assets/images/foto_admin.jpg" alt="Foto" width="35px" style="border-radius: 50%;"></td>
                        <td>Sebastian</td>
                        <td>Pereira</td>
                        <td>08:13 AM</td>
                    </tr>
                    <tr>
                        <td><img src="/Dashboard/assets/images/foto_admin.jpg" alt="Foto" width="35px" style="border-radius: 50%;"></td>
                        <td>Camilo</td>
                        <td>Mori</td>
                        <td>07:52 AM</td>
                    </tr>
                </tbody>
            </table>
        </article>
    </section>
</main>
