<style>
    
    .config-card {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 120px);
        max-height: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        overflow: hidden;
    }

    
    .section-header {
        flex-shrink: 0;
        padding: 20px 24px;
        background-color: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
    }

    .section-header h2 {
        font-size: 1.15rem;
        font-weight: 600;
        color: #1e293b;
        margin: 0;
    }

    .section-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 24px;
        overflow: hidden;
    }

    .role-group {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
    }

    .role-group label {
        font-size: 0.875rem;
        font-weight: 600;
        color: #475569;
    }

    .required {
        color: #ef4444;
        margin-right: 4px;
    }

    .role-group input[type="text"] {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.95rem;
        outline: none;
        background-color: #f8fafc;
        color: #64748b;
        cursor: not-allowed;
    }

    .section-body h3 {
        flex-shrink: 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 12px;
    }

    .table-scroll-container {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background-color: #f8fafc;
    }

    .table-scroll-container::-webkit-scrollbar {
        width: 6px;
    }
    .table-scroll-container::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
    }

    /* Tabla estilizada */
    .tiles-table {
        width: 100%;
        border-collapse: collapse;
        background-color: #f8fafc;
    }

    .tiles-table tr {
        transition: background-color 0.15s ease;
    }

    .tiles-table tr:nth-child(even) { background-color: #ffffff; }
    .tiles-table tr:nth-child(odd) { background-color: #f8fafc; }
    .tiles-table tr:hover { background-color: #f1f5f9; }

    .tiles-table td {
        padding: 12px 16px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 0.9rem;
        color: #1e293b;
        vertical-align: middle;
    }

    .tiles-table tr:last-child td {
        border-bottom: none;
    }

    .tile-title-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
    }

    .tile-controls {
        text-align: right;
    }

    .status-select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        padding: 6px 32px 6px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background-color: #ffffff;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23334155%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 10px auto;
        color: #334155;
        font-size: 0.85rem;
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s;
    }

    .status-select:focus {
        border-color: #3b82f6;
    }

    
    .section-footer {
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        background-color: #f8fafc;
        border-top: 1px solid #e2e8f0;
    }

    .btn {
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s;
    }

    .btn-secondary {
        background-color: #ffffff;
        border-color: #cbd5e1;
        color: #475569;
    }

    .btn-secondary:hover {
        background-color: #f1f5f9;
        color: #1e293b;
    }

    .btn-primary {
        background-color: #0f172a;
        color: #ffffff;
    }

    .btn-primary:hover {
        background-color: #1e293b;
    }
</style>

<div class="config-card">
    <header class="section-header">
        <h2>Configuraciones | Sistema de Asistencia</h2>
    </header>

    <section class="section-body">
        <div class="role-group">
            <label for="institution-name">
                <span class="required">*</span>
                Nombre de institución
            </label>
            <input type="text" id="institution-name" value="Liceo Arturo Matte Larrain" readonly />
        </div>

        <h3>Módulos de Control</h3>

        <div class="table-scroll-container">
            <table class="tiles-table">
                <tbody>
                    <tr>
                        <td>
                            <div class="tile-title-wrapper">
                                <span>Tecnología NFC</span>
                            </div>
                        </td>
                        <td class="tile-controls">
                            <select class="status-select">
                                <option value="enabled" selected>Habilitado</option>
                                <option value="disabled">Deshabilitado</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <div class="tile-title-wrapper">
                                <span>Biometría Facial</span>
                            </div>
                        </td>
                        <td class="tile-controls">
                            <select class="status-select">
                                <option value="enabled" selected>Habilitado</option>
                                <option value="disabled">Deshabilitado</option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer class="section-footer">
        <button type="button" class="btn btn-secondary">Por defecto</button>
        <button type="submit" class="btn btn-primary">Aplicar cambios</button>
    </footer>
</div>
