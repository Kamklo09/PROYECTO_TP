
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #333;
        }

        main {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        .tarjetas {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .tarjetas article {
            background: white;
            width: 25%;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .tarjetas h3 {
            color: #777;
            margin-bottom: 10px;
        }

        .tarjetas p {
            font-size: 28px;
            font-weight: bold;
        }

        #nav-analiticas {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 10px;
        }

        #nav-analiticas button {
            background: #969696;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        #nav-analiticas button:hover {
            background: #555;
        }

        #nav-analiticas button.activo {
            background: #323232;
        }

        .graficos {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .graficos article {
            width: 50%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .graficos h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .grafico {
            height: 300px;
        }

        .tabla {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .tabla h2 {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f5f5f5;
        }

        #tabla {
            transition: 0.3s;
        }

        #tabla.oculto {
            opacity: 0;
        }

    </style>

    <main>
        <nav id="nav-analiticas">

            <button id="A" onclick="cambiarCurso('A')">
                A
            </button>

            <button id="B" onclick="cambiarCurso('B')">
                B
            </button>

            <button id="C" onclick="cambiarCurso('C')">
                C
            </button>

        </nav>


        <section class="tarjetas">

            <article>

                <h3>Total Alumnos</h3>
                <p>45</p>

            </article>

            <article>

                <h3>Asistencia total</h3>
                <p>1000</p>

            </article>

            <article>

                <h3>Atrasos</h3>
                <p>370</p>

            </article>

            <article>

                <h3>Inasistencias</h3>
                <p>140</p>

            </article>

        </section>


        


        <section class="graficos">

            <article>

                <h2>Inasistencias</h2>

                <figure class="grafico">

                    <canvas id="torta"></canvas>

                </figure>

            </article>


            <article>

                <h2>Inasistencias por curso</h2>

                <figure class="grafico">

                    <canvas id="linea"></canvas>

                </figure>

            </article>

        </section>


        <section class="tabla">

            <h2>Registro de estadísticas</h2>

            <table>

                <thead>

                    <tr>

                        <th>Curso</th>
                        <th>Asistentes</th>
                        <th>Retiros</th>
                        <th>Atrasos</th>
                        <th>Inasistencias</th>

                    </tr>

                </thead>

                <tbody id="tabla"></tbody>

            </table>

        </section>

    </main>
