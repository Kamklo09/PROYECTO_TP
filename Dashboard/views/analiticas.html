<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Analítico</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #333;
        }

        main {
            width: 80%;
            margin: 30px auto;
        }

        header {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        header p {
            color: #777;
        }

        .tarjetas {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .tarjetas article {
            background-color: white;
            width: 25%;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .tarjetas h3 {
            color: #777;
            margin-bottom: 10px;
        }

        .tarjetas p {
            font-size: 28px;
            font-weight: bold;
        }

        .graficos {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .graficos article {
            width: 50%;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .graficos h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .grafico {
            width: 100%;
            height: 300px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            background-color: #969696;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #323232;
        }

        .tabla {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .tabla h2 {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f5f5f5;
        }

        #tabla {
            transition: 0.3s;
        }

        #tabla.oculto {
            opacity: 0;
        }

    </style>

</head>


<body>

    <main>

        <header>

            <p>
                Resumen general del registro de los alumnos
                y estadísticas sobre atrasos e inasistencias
            </p>

        </header>


        <section class="tarjetas">

            <article>

                <h3>Total Alumnos</h3>

                <p>45</p>

            </article>


            <article>

                <h3>Asistencia total</h3>

                <p>1000</p>

            </article>


            <article>

                <h3>Atrasos</h3>

                <p>370</p>

            </article>


            <article>

                <h3>Inasistencias</h3>

                <p>140</p>

            </article>

        </section>


        <section class="graficos">


            <!-- GRAFICO DE TORTA -->

            <article>

                <h2>Inasistencias</h2>

                <nav>

                    <button onclick="cambiarCurso('A')">
                        A
                    </button>

                    <button onclick="cambiarCurso('B')">
                        B
                    </button>

                    <button onclick="cambiarCurso('C')">
                        C
                    </button>

                </nav>


                <figure class="grafico">

                    <canvas id="torta"></canvas>

                </figure>

            </article>


            <!-- GRAFICO DE LINEA -->

            <article>

                <h2>Inasistencias por curso</h2>

                <figure class="grafico">

                    <canvas id="linea"></canvas>

                </figure>

            </article>

        </section>


        <section class="tabla">

            <h2>Registro de estadísticas</h2>

            <nav>

                <button onclick="cambiarCurso('A')">
                    A
                </button>

                <button onclick="cambiarCurso('B')">
                    B
                </button>

                <button onclick="cambiarCurso('C')">
                    C
                </button>

            </nav>


            <table>

                <thead>

                    <tr>

                        <th>Curso</th>
                        <th>Asistentes</th>
                        <th>Retiros</th>
                        <th>Atrasos</th>
                        <th>Inasistencias</th>

                    </tr>

                </thead>


                <tbody id="tabla">

                </tbody>

            </table>

        </section>

    </main>


    <script>


        // Datos de los cursos

        let cursos = {

            A: {

                nombres: [
                    "7°A",
                    "8°A",
                    "1°A",
                    "2°A",
                    "3°A",
                    "4°A"
                ],

                asistentes: [
                    35,
                    36,
                    37,
                    38,
                    39,
                    40
                ],

                retiros: [
                    2,
                    2,
                    2,
                    1,
                    1,
                    2
                ],

                atrasos: [
                    10,
                    15,
                    8,
                    12,
                    18,
                    9
                ],

                inasistencias: [
                    4,
                    6,
                    3,
                    5,
                    6,
                    3
                ]

            },


            B: {

                nombres: [
                    "7°B",
                    "8°B",
                    "1°B",
                    "2°B",
                    "3°B",
                    "4°B"
                ],

                asistentes: [
                    32,
                    33,
                    34,
                    35,
                    36,
                    37
                ],

                retiros: [
                    3,
                    2,
                    3,
                    2,
                    2,
                    1
                ],

                atrasos: [
                    7,
                    12,
                    10,
                    15,
                    9,
                    14
                ],

                inasistencias: [
                    5,
                    5,
                    6,
                    7,
                    5,
                    5
                ]

            },


            C: {

                nombres: [
                    "7°C",
                    "8°C",
                    "1°C",
                    "2°C",
                    "3°C",
                    "4°C"
                ],

                asistentes: [
                    34,
                    35,
                    36,
                    37,
                    38,
                    39
                ],

                retiros: [
                    1,
                    1,
                    2,
                    2,
                    1,
                    2
                ],

                atrasos: [
                    5,
                    9,
                    13,
                    8,
                    11,
                    6
                ],

                inasistencias: [
                    3,
                    4,
                    4,
                    4,
                    4,
                    3
                ]

            }

        };


        // Grafico de torta

        let torta = document
            .getElementById("torta")
            .getContext("2d");


        let miTorta = new Chart(torta, {

            type: "pie",

            data: {

                labels: cursos.A.nombres,

                datasets: [{

                    label: "Inasistencias",

                    data: cursos.A.inasistencias,

                    backgroundColor: [

                        "#323232",
                        "#646464",
                        "#969696",
                        "#c0c0c0",
                        "#dddddd",
                        "#f5f5f5"

                    ]

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false

            }

        });


        // Grafico de linea

        let linea = document
            .getElementById("linea")
            .getContext("2d");


        let miLinea = new Chart(linea, {

            type: "line",

            data: {

                labels: cursos.A.nombres,

                datasets: [{

                    label: "Inasistencias",

                    data: cursos.A.inasistencias,

                    borderColor: "#323232",

                    backgroundColor: "#dddddd",

                    fill: true

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false

            }

        });


        // Cambiar curso

        function cambiarCurso(letra) {

            let curso = cursos[letra];


            // Cambiar el grafico de torta

            miTorta.data.labels =
                curso.nombres;

            miTorta.data.datasets[0].data =
                curso.inasistencias;

            miTorta.update();


            // Cambiar el grafico de linea

            miLinea.data.labels =
                curso.nombres;

            miLinea.data.datasets[0].data =
                curso.inasistencias;

            miLinea.update();


            // Cambiar la tabla

            let tabla =
                document.getElementById("tabla");


            tabla.classList.add("oculto");


            setTimeout(function() {

                tabla.innerHTML = "";


                for (
                    let i = 0;
                    i < curso.nombres.length;
                    i++
                ) {

                    tabla.innerHTML +=

                        "<tr>" +

                        "<td>" +
                        curso.nombres[i] +
                        "</td>" +

                        "<td>" +
                        curso.asistentes[i] +
                        "</td>" +

                        "<td>" +
                        curso.retiros[i] +
                        "</td>" +

                        "<td>" +
                        curso.atrasos[i] +
                        "</td>" +

                        "<td>" +
                        curso.inasistencias[i] +
                        "</td>" +

                        "</tr>";

                }


                tabla.classList.remove("oculto");

            }, 300);

        }


        // Mostrar A al iniciar

        cambiarCurso("A");

    </script>

</body>

</html>
