<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    main {
        height: 100%;
        width: 100%;
        overflow-y: scroll;
        scrollbar-width: none;
    }

    header {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 25px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    header p {
        color: #777;
    }

    .tarjetas {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
    }

    .tarjetas article {
        background-color: white;
        width: 25%;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .tarjetas h3 {
        color: #777;
        margin-bottom: 10px;
    }

    .tarjetas p {
        font-size: 28px;
        font-weight: bold;
    }

    .graficos {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
    }

    .graficos article {
        width: 50%;
        background-color: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .graficos h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .grafico {
        width: 100%;
        height: 300px;
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    button {
        padding: 8px 20px;
        border: none;
        border-radius: 6px;
        background-color: #969696;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #323232;
    }

    .tabla {
        background-color: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .tabla h2 {
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #f5f5f5;
    }

    #tabla {
        transition: 0.3s;
    }

    #tabla.oculto {
        opacity: 0;
    }
</style>

<!--Inicio-->

<main>
    <section class="tarjetas">
        <article>
            <h3>Registros Totales</h3>

            <p>1000</p>
        </article>

        <article>
            <h3>Entradas Alumnos</h3>

            <p>925</p>
        </article>

        <article>
            <h3>Atrasos</h3>

            <p>300</p>
        </article>

        <article>
            <h3>Inasistencias</h3>

            <p>75</p>
        </article>
    </section>

    <section class="graficos">
        <!-- GRAFICO DE TORTA -->

        <article>
            <h2>Inasistencias</h2>

            <nav>
                <button onclick="cambiarCurso('A')">A</button>

                <button onclick="cambiarCurso('B')">B</button>

                <button onclick="cambiarCurso('C')">C</button>
            </nav>

            <figure class="grafico">
                <canvas id="torta"></canvas>
            </figure>
        </article>

        <!-- GRAFICO DE LINEA -->

        <article>
            <h2>Inasistencias por curso</h2>

            <figure class="grafico">
                <canvas id="linea"></canvas>
            </figure>
        </article>
    </section>

    <!--Letras de cursos-->

    <section class="tabla">
        <h2>Registro de estadísticas</h2>

        <nav>
            <button onclick="cambiarCurso('A')">A</button>

            <button onclick="cambiarCurso('B')">B</button>

            <button onclick="cambiarCurso('C')">C</button>
        </nav>

        <table>
            <thead>
                <tr>
                    <th>Curso</th>
                    <th>Asistentes</th>
                    <th>Retiros</th>
                    <th>Atrasos</th>
                    <th>Inasistencias</th>
                </tr>
            </thead>

            <tbody id="tabla"></tbody>
        </table>
    </section>
</main>
