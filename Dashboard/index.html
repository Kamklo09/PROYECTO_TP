<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dashboard</title>
        <link rel="icon" type="image/x-icon" href="../LogoSAS.ico?v=1" />

        <!--Enlaces-->

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <!--Navegador-->

        <nav class="nav-top-main">
            <div class="title-main">
                <!--Panel de control-->
                <h1>Panel de control</h1>
            </div>
            <!-- Contenedor del menú desplegable -->
            <div class="dropdown-admin">
                <button>
                    <img src="assets/images/foto_admin.jpg" alt="" height="35px" width="35px" />
                    <span>Administrador</span>
                </button>
                <!-- Opciones del menú -->
                <div class="dropdown-content">
                    <!-- Ruta relativa hacia la carpeta landing -->
                    <a href="../landing/index.html">Cerrar sesión</a>
                </div>
            </div>
        </nav>

        <!--Aside-->
        <aside>
            <div class="aside-title">
                <i></i>
                <span>School Attendance System</span>
            </div>

            <nav class="aside-links">
                <a href="#" class="nav-links" data-view="inicio.html">
                    <i class="bi bi-house-fill"></i>
                    <span>Panel de control</span>
                </a>

                <a href="#" class="nav-links" data-view="usuarios.html">
                    <i class="bi bi-person-vcard-fill"></i>
                    <span>Estudiantes</span>
                </a>

                <a href="#" class="nav-links" data-view="analiticas.html">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Analiticas</span>
                </a>

                <a href="#" class="nav-links" data-view="reportes.html">
                    <i class="bi bi-envelope-fill"></i>
                    <span>Reportes</span>
                </a>

                <a href="#" class="nav-links" data-view="configuraciones.html">
                    <i class="bi bi-wrench"></i>
                    <span>Configuraciones</span>
                </a>
            </nav>
        </aside>

        <main id="container-views"></main>

        <script>
            window.actualizarFechaUI = function () {
                const contenedor = document.getElementById("date");
                if (!contenedor) return;

                const meses = [
                    "Enero",
                    "Febrero",
                    "Marzo",
                    "Abril",
                    "Mayo",
                    "Junio",
                    "Julio",
                    "Agosto",
                    "Septiembre",
                    "Octubre",
                    "Noviembre",
                    "Diciembre",
                ];

                const hoy = new Date();
                contenedor.textContent = `${hoy.getDate()} ${meses[hoy.getMonth()]} ${hoy.getFullYear()}`;
            };

            document.addEventListener("DOMContentLoaded", () => {
                const container = document.getElementById("container-views");
                const links = document.querySelectorAll(".nav-links");
                const mainTitle = document.querySelector(".title-main h1");

                let currentView = "";

                async function loadView(viewName, titleText) {
                    if (currentView === viewName) return;

                    try {
                        container.classList.add("fade-out");

                        const response = await fetch(`views/${viewName}`);
                        if (!response.ok) {
                            throw new Error(`Error ${response.status}: No se pudo encontrar views/${viewName}`);
                        }

                        const html = await response.text();

                        setTimeout(async () => {
                            container.innerHTML = html;

                            if (mainTitle && titleText) {
                                mainTitle.textContent = titleText;
                            }

                            window.actualizarFechaUI();

                            // --- EJECUCIÓN CONTINUA DE LA INICIALIZACIÓN ---
                            if (viewName === "analiticas.html") {
                                await cargarScriptVista("views/analiticas.js");
                                // Se ejecuta SIEMPRE cada vez que entra a la vista
                                if (typeof window.inicializarAnaliticas === "function") {
                                    window.inicializarAnaliticas();
                                }
                            }
                            // -----------------------------------------------

                            currentView = viewName;
                            container.classList.remove("fade-out");
                        }, 200);
                    } catch (error) {
                        console.error(error);
                        container.innerHTML = `<p style="color:red;">Error al cargar la vista.</p>`;
                        container.classList.remove("fade-out");
                    }
                }

                function cargarScriptVista(src) {
                    return new Promise((resolve, reject) => {
                        if (document.querySelector(`script[src="${src}"]`)) {
                            // El script ya existe cargado en memoria, permitimos continuar inmediatamente
                            resolve();
                            return;
                        }
                        const script = document.createElement("script");
                        script.src = src;
                        script.onload = resolve;
                        script.onerror = reject;
                        document.body.appendChild(script);
                    });
                }

                links.forEach((link) => {
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        const viewName = link.getAttribute("data-view");
                        const linkText = link.querySelector("span")?.textContent.trim();

                        if (viewName) {
                            loadView(viewName, linkText);
                        }
                    });
                });

                loadView("inicio.html", "Panel de control");
            });
        </script>
    </body>
</html>
